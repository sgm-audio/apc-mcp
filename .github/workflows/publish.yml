name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        # `npm run lint` is ESLint over the whole repo plus a parse check.
        run: npm run lint
      - name: Test
        run: npm test
      - name: Scaffold smoke (every type x ui)
        run: npm run smoke
      - name: Security advisories
        run: npm audit --audit-level=high
      - name: Smoke test — all 7 tools register
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 5 node index.js | python3 -c "
          import sys, json
          msgs = [json.loads(l) for l in sys.stdin.read().splitlines() if l.strip()]
          tools_msg = next((m for m in msgs if m.get('id') == 2), None)
          if not tools_msg:
            print(f'FAIL: no tools/list response in {msgs}')
            sys.exit(1)
          names = [t['name'] for t in tools_msg['result']['tools']]
          expected = ['audio_plugin_build','audio_plugin_configure','audio_plugin_create','audio_plugin_lint','audio_plugin_plugins','audio_plugin_test','audio_plugin_validate']
          missing = [n for n in expected if n not in names]
          if missing:
            print(f'FAIL: missing tools: {missing}')
            sys.exit(1)
          print(f'OK: {len(names)} tools registered')
          "

  # Compiles the scaffolded C/C++ with real gcc/g++ front ends. JUCE sources go
  # against tests/fixtures/juce-api-stub (a transcription of the JUCE 9 API);
  # CLAP and LV2 sources go against real free-audio/clap and lv2/lv2 headers.
  compile-scaffold:
    name: Scaffolded C/C++ compiles
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clone free-audio/clap headers
        run: git clone --depth 1 https://github.com/free-audio/clap.git "${RUNNER_TEMP}/clap"
      - name: Clone lv2/lv2 headers
        run: git clone --depth 1 https://github.com/lv2/lv2.git "${RUNNER_TEMP}/lv2"
      # Both env vars must be set or the corresponding compile checks skip rather
      # than run — tests/cpp-api.test.js has a guard test per header set so a
      # silent skip cannot read as a pass.
      - name: Compile-check every scaffolded source file
        env:
          APC_CLAP_INCLUDE: ${{ runner.temp }}/clap/include
          APC_LV2_INCLUDE: ${{ runner.temp }}/lv2/include
        run: node --test tests/cpp-api.test.js

  # Configures, compiles, and links the native LV2 template against real cmake
  # and the real LV2 headers, verifying the resulting .lv2 bundle on disk.
  scaffold-lv2:
    name: Scaffolded LV2 builds with real cmake
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clone lv2/lv2 for the headers
        run: git clone --depth 1 https://github.com/lv2/lv2.git "${RUNNER_TEMP}/lv2"
      - name: Build and verify every scaffolded LV2 plugin
        env:
          APC_LV2_DIR: ${{ runner.temp }}/lv2/include
        run: node scripts/smoke-scaffold.mjs --build

  # Configures, compiles, and links the CLAP template against free-audio/clap.
  scaffold-clap:
    name: Scaffolded CLAP builds with real cmake
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vendor free-audio/clap at _tools/clap
        run: git clone --depth 1 https://github.com/free-audio/clap.git "${RUNNER_TEMP}/clap"
      - name: Build and verify every scaffolded CLAP plugin
        env:
          APC_CLAP_DIR: ${{ runner.temp }}/clap
        run: node scripts/smoke-scaffold.mjs --build

  # Configures, compiles, and links the JUCE, JUCE+WebView, and standalone
  # templates against a real JUCE 9 checkout on Ubuntu.
  scaffold-juce:
    name: Scaffolded JUCE builds with real cmake
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Clone JUCE 9
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git "${RUNNER_TEMP}/JUCE"
      - name: Build and verify every scaffolded JUCE plugin & standalone app
        env:
          APC_JUCE_DIR: ${{ runner.temp }}/JUCE
        run: xvfb-run -a node scripts/smoke-scaffold.mjs --build

  license:
    name: License check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      # Reads package-lock.json directly — no install needed.
      - name: Verify dependency licenses against license_decisions.yml
        run: node scripts/check-licenses.mjs

  publish:
    needs: [test, license, compile-scaffold, scaffold-clap, scaffold-lv2, scaffold-juce]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
