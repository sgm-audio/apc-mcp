name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
        # macOS is in the gate because the server branches on process.platform
        # (generator default, win32 PATH extension handling, bundle-vs-binary
        # artefact discovery) and none of that was ever executed anywhere but
        # Linux. Windows is deliberately NOT here: the security tests drive POSIX
        # shebang shims, so a Windows failure would say nothing about the server.
        # Windows support therefore remains unverified — see docs/project-status.md.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        # `npm run lint` is ESLint over the whole repo plus a parse check.
        run: npm run lint
      - name: Documentation links
        run: npm run docs:check
      - name: Test
        run: npm test
      - name: Scaffold smoke (every type x ui)
        run: npm run smoke
      - name: Security advisories
        # `npm run audit` is plain `npm audit`, i.e. exactly the gate documented
        # in docs/project-status.md. Using --audit-level=high here instead made
        # CI green while the documented local baseline failed.
        run: npm run audit
      - name: Smoke test — the real server registers all 7 tools over stdio
        # This was an inline printf pipeline wrapped in `timeout` and piped into
        # python3. It failed on macOS for the only reason it could: that utility is
        # GNU coreutils and does not exist there. Doing it in Node also removes the
        # python3 dependency and the hang risk.
        run: node scripts/smoke-stdio.mjs

  # Compiles the scaffolded C/C++ with real gcc/g++ front ends. JUCE sources go
  # against tests/fixtures/juce-api-stub (a transcription of the JUCE 9 API);
  # CLAP and LV2 sources go against real free-audio/clap and lv2/lv2 headers.
  compile-scaffold:
    name: Scaffolded C/C++ compiles
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clone free-audio/clap headers
        run: git clone --depth 1 https://github.com/free-audio/clap.git "${RUNNER_TEMP}/clap"
      - name: Clone lv2/lv2 headers
        run: git clone --depth 1 https://github.com/lv2/lv2.git "${RUNNER_TEMP}/lv2"
      # Both env vars must be set or the corresponding compile checks skip rather
      # than run — tests/cpp-api.test.js has a guard test per header set so a
      # silent skip cannot read as a pass.
      - name: Compile-check every scaffolded source file
        env:
          APC_CLAP_INCLUDE: ${{ runner.temp }}/clap/include
          APC_LV2_INCLUDE: ${{ runner.temp }}/lv2/include
        run: node --test tests/cpp-api.test.js

  # Configures, compiles, and links the native LV2 template against real cmake
  # and the real LV2 headers, verifying the resulting .lv2 bundle on disk.
  scaffold-lv2:
    name: Scaffolded LV2 builds with real cmake
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clone lv2/lv2 for the headers
        run: git clone --depth 1 https://github.com/lv2/lv2.git "${RUNNER_TEMP}/lv2"
      - name: Build and verify every scaffolded LV2 plugin
        env:
          APC_LV2_DIR: ${{ runner.temp }}/lv2/include
        run: node scripts/smoke-scaffold.mjs --build

  # Configures, compiles, and links the CLAP template against free-audio/clap.
  scaffold-clap:
    name: Scaffolded CLAP builds with real cmake
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vendor free-audio/clap at _tools/clap
        run: git clone --depth 1 https://github.com/free-audio/clap.git "${RUNNER_TEMP}/clap"
      - name: Build and verify every scaffolded CLAP plugin
        env:
          APC_CLAP_DIR: ${{ runner.temp }}/clap
        run: node scripts/smoke-scaffold.mjs --build

  # Configures, compiles, and links the JUCE, JUCE+WebView, and standalone
  # templates against a real JUCE 9 checkout on Ubuntu.
  scaffold-juce:
    name: Scaffolded JUCE builds with real cmake
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Clone JUCE 9
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git "${RUNNER_TEMP}/JUCE"
      - name: Build and verify every scaffolded JUCE plugin & standalone app
        env:
          APC_JUCE_DIR: ${{ runner.temp }}/JUCE
        run: xvfb-run -a node scripts/smoke-scaffold.mjs --build

  # The rest of the suite drives PATH shims: it proves the argv shape and the
  # reporting logic, but not that the upstream binary accepts the invocation or
  # that a freshly scaffolded plugin passes it. These two jobs scaffold, build
  # and validate for real, and require a PASS — a skip fails the job.
  #
  # Build and validate are separate steps sharing a directory, so a red job says
  # which half broke. Each step also re-publishes the tail of its log as an error
  # *annotation* on the check run, which is readable over the API even when the
  # job log is not.
  scaffold-clap-validate:
    name: audio_plugin_validate against real clap-validator
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vendor free-audio/clap at _tools/clap
        run: git clone --depth 1 https://github.com/free-audio/clap.git "${RUNNER_TEMP}/clap"
      - name: Install clap-validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/cv"
          mkdir -p "$dir"
          # Download by asset id and inspect what actually arrived rather than
          # assuming the archive's internal layout.
          id=$(gh api repos/free-audio/clap-validator/releases/tags/0.4.1 \
                 --jq '[.assets[] | select(.name | test("ubuntu"))][0].id')
          test -n "$id" -a "$id" != "null"
          gh api -H 'Accept: application/octet-stream' \
            "repos/free-audio/clap-validator/releases/assets/$id" > "$dir/asset"
          echo "asset: $(file -b "$dir/asset")"
          mkdir -p "$dir/x"
          case "$(file -b "$dir/asset")" in
            *Zip*)   unzip -o -q "$dir/asset" -d "$dir/x" ;;
            *gzip*)  tar -xzf "$dir/asset" -C "$dir/x" ;;
            *) echo "::error title=clap-validator asset::unexpected archive type: $(file -b "$dir/asset")"; exit 1 ;;
          esac
          # Belt and braces: unpack any tarball the zip may nest.
          while IFS= read -r t; do tar -xzf "$t" -C "$(dirname "$t")"; done \
            < <(find "$dir/x" -name '*.tar.gz')
          echo "extracted:"; find "$dir/x" -type f -printf '  %m %10s %p\n' | sort -k3
          BIN=$(find "$dir/x" -type f -name 'clap-validator*' \
                  ! -name '*.tar.gz' ! -name '*.zip' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error title=clap-validator asset::no clap-validator binary in the archive"
            exit 1
          fi
          chmod +x "$BIN"
          "$BIN" --version || true
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
      - name: Build a real CLAP plugin
        env:
          APC_CLAP_DIR: ${{ runner.temp }}/clap
        run: |
          set -o pipefail
          node scripts/smoke-validate.mjs --type=clap --phase=build --dir="${RUNNER_TEMP}/sv-clap" 2>&1 \
            | tee "${RUNNER_TEMP}/build.log" \
            || { echo "::error title=smoke-validate build::$(sed 's/%/%25/g' "${RUNNER_TEMP}/build.log" | tail -c 3000 | awk 'BEGIN{ORS=""}{printf "%s%%0A",$0}')"; exit 1; }
      - name: Validate it with the real clap-validator
        run: |
          set -o pipefail
          node scripts/smoke-validate.mjs --type=clap --phase=validate --dir="${RUNNER_TEMP}/sv-clap" 2>&1 \
            | tee "${RUNNER_TEMP}/validate.log" \
            || { echo "::error title=smoke-validate validate::$(sed 's/%/%25/g' "${RUNNER_TEMP}/validate.log" | tail -c 3000 | awk 'BEGIN{ORS=""}{printf "%s%%0A",$0}')"; exit 1; }

  scaffold-juce-validate:
    name: audio_plugin_validate against real pluginval
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install JUCE + pluginval runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb unzip file \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgtk-3-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Clone JUCE 9
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git "${RUNNER_TEMP}/JUCE"
      - name: Install pluginval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/pv"
          mkdir -p "$dir/x"
          gh release download v1.0.4 --repo Tracktion/pluginval \
            --pattern 'pluginval_Linux.zip' --dir "$dir"
          unzip -o -q "$dir/pluginval_Linux.zip" -d "$dir/x"
          find "$dir/x" -type f -printf '  %m %10s %p\n' | sort -k3
          BIN=$(find "$dir/x" -type f -name 'pluginval' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error title=pluginval asset::no pluginval binary in the archive"
            exit 1
          fi
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
      - name: Build a real VST3 plugin
        env:
          APC_JUCE_DIR: ${{ runner.temp }}/JUCE
        run: |
          set -o pipefail
          node scripts/smoke-validate.mjs --type=juce --phase=build --dir="${RUNNER_TEMP}/sv-juce" 2>&1 \
            | tee "${RUNNER_TEMP}/build.log" \
            || { echo "::error title=smoke-validate build::$(sed 's/%/%25/g' "${RUNNER_TEMP}/build.log" | tail -c 3000 | awk 'BEGIN{ORS=""}{printf "%s%%0A",$0}')"; exit 1; }
      - name: Validate it with the real pluginval
        # pluginval is a JUCE GUI application: it needs a display even in CI.
        run: |
          set -o pipefail
          xvfb-run -a node scripts/smoke-validate.mjs --type=juce --phase=validate --dir="${RUNNER_TEMP}/sv-juce" 2>&1 \
            | tee "${RUNNER_TEMP}/validate.log" \
            || { echo "::error title=smoke-validate validate::$(sed 's/%/%25/g' "${RUNNER_TEMP}/validate.log" | tail -c 3000 | awk 'BEGIN{ORS=""}{printf "%s%%0A",$0}')"; exit 1; }

  license:
    name: License check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      # Reads package-lock.json directly — no install needed.
      - name: Verify dependency licenses against license_decisions.yml
        run: node scripts/check-licenses.mjs

  publish:
    needs: [test, license, compile-scaffold, scaffold-clap, scaffold-lv2, scaffold-juce,
            scaffold-clap-validate, scaffold-juce-validate]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
